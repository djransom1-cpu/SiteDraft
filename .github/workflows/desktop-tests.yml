name: Desktop tests

# Runs the shared desktop unit tests (elevations, floor plan, print, ...) on every push and
# pull request. Builds nothing for release and deploys nothing.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Recreate firebase.properties from secret
        run: echo "${{ secrets.FIREBASE_PROPERTIES_BASE64 }}" | base64 -d > firebase.properties

      - name: Run desktop tests
        run: ./gradlew :shared:desktopTest --no-daemon --console=plain
