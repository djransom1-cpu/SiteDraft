name: Web app

# Builds the SiteDraft web app (Kotlin/Wasm) on every push to main and keeps the result as a
# downloadable artifact. When the repository variable DEPLOY_PAGES is "true" (and GitHub Pages
# is set to deploy from Actions under Settings > Pages), it also publishes the build to Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The first wasm build on a clean machine can stop on the Kotlin/JS yarn lockfile check;
      # a second run goes through, so retry once.
      - name: Build web distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --console=plain
          || ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --console=plain

      - name: Keep the build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitedraft-web
          path: webApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error

      - name: Stage for GitHub Pages
        if: vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    if: vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
