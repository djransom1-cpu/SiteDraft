name: Desktop installer (Windows MSI)

# Builds the Windows installer on a GitHub Windows runner, the same way the laptop build is
# made locally (./gradlew :desktopApp:packageMsi), and keeps it as a downloadable artifact.
# Run it from the Actions tab, or push a version tag: git tag v1.0.6 && git push origin v1.0.6

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installer (MSI)
        run: .\gradlew.bat :desktopApp:packageMsi --no-daemon --console=plain

      - name: Name the installer by version
        id: msi
        shell: pwsh
        run: |
          $version = (Select-String -Path desktopApp/build.gradle.kts -Pattern 'packageVersion = "(.*)"').Matches[0].Groups[1].Value
          $msi = Get-ChildItem -Path "desktopApp/build/compose/binaries/main/msi" -Filter *.msi -Recurse | Select-Object -First 1
          echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: SiteDraft-${{ steps.msi.outputs.version }}-windows-installer
          path: ${{ steps.msi.outputs.msi_path }}
          if-no-files-found: error
